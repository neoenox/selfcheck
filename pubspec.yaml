name: selfcheck_jibun_check
description: "Device-local JAN and price comparison app."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera + on-device recognition. camera_android intentionally selects the
  # Camera2 implementation so ML Kit receives the supported NV21 image stream.
  camera: ^0.12.0+2
  camera_android: ^0.10.11+1
  google_mlkit_commons: ^0.13.0
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
